name: CI

on:
  push:
    branches: [main, dev, devops-recovery]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v3

      - name: Configurar pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Configurar Node
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install

      - name: Revisar código (lint)
        run: pnpm lint || echo "lint no configurado"

      - name: Ejecutar pruebas frontend
        run: pnpm --filter frontend test || echo "sin pruebas frontend"

      - name: Ejecutar pruebas backend
        run: pnpm --filter backend test || echo "sin pruebas backend"

      - name: Build del proyecto
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}